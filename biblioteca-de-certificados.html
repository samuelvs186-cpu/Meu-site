<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca de Certificados</title>
  <style>
    :root {
      --bg: #050806;
      --surface: #0d1713;
      --surface-strong: #11201b;
      --card: rgba(17, 32, 27, 0.8);
      --card-border: rgba(103, 255, 194, 0.18);
      --green: #00d084;
      --green-light: #67ffc2;
      --text: #edfdf5;
      --muted: #a7c1b4;
      --shadow: rgba(0, 0, 0, 0.35);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(circle at top, rgba(0, 208, 132, 0.12), transparent 35%),
        var(--bg);
      color: var(--text);
    }

    .header {
      padding: 48px 24px 30px;
      text-align: center;
      background: linear-gradient(180deg, rgba(0, 208, 132, 0.15), rgba(0, 0, 0, 0.1));
      border-bottom: 1px solid var(--card-border);
    }

    .header h1 {
      margin: 0 0 12px;
      font-size: clamp(2rem, 4vw, 3.2rem);
      color: var(--green-light);
    }

    .header p {
      max-width: 820px;
      margin: 0 auto;
      color: var(--muted);
      line-height: 1.6;
      font-size: 1rem;
    }

    main {
      width: min(1200px, 100%);
      margin: 0 auto;
      padding: 42px 24px 80px;
    }

    .cert-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 28px;
      align-items: stretch;
    }

    @media (max-width: 900px) {
      .cert-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 600px) {
      .cert-grid {
        grid-template-columns: 1fr;
      }
    }

    .cert-card {
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      width: 100%;
      min-width: 0;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      background: linear-gradient(145deg, rgba(17, 32, 27, 0.95), rgba(8, 18, 14, 0.95));
      color: var(--text);
      cursor: pointer;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
      text-align: left;
      padding: 0;
      font: inherit;
    }

    .cert-card:hover {
      transform: translateY(-8px);
      border-color: rgba(103, 255, 194, 0.45);
      box-shadow:
        0 20px 45px rgba(0, 0, 0, 0.4),
        0 0 25px rgba(0, 208, 132, 0.08);
    }

    .cert-card:focus-visible {
      transform: translateY(-4px);
      border-color: rgba(103, 255, 194, 0.4);
      box-shadow: 0 18px 38px rgba(0, 0, 0, 0.4);
      outline: none;
    }

    .cert-card__image {
      width: 100%;
      aspect-ratio: 16 / 10;
      overflow: hidden;
      background: linear-gradient(135deg, #0c1914, #132820);
    }

    .cert-card__image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }

    .cert-card:hover .cert-card__image img {
      transform: scale(1.04);
    }

    .cert-card__content {
      display: flex;
      flex-direction: column;
      padding: 20px;
      gap: 8px;
    }

    .cert-card__tag {
      width: fit-content;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(0, 208, 132, 0.12);
      color: var(--green-light);
      font-size: 0.7rem;
      font-weight: 800;
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .cert-card h2 {
      margin: 4px 0 0;
      font-size: 1.25rem;
      line-height: 1.25;
      color: var(--text);
    }

    .cert-card p {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: 0.92rem;
      line-height: 1.5;
    }

    .cert-modal {
      position: fixed;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(3, 8, 7, 0.8);
      backdrop-filter: blur(6px);
      padding: 20px;
      z-index: 1000;
    }

    .cert-modal.is-open {
      display: flex;
    }

    .cert-modal__content {
      width: min(100%, 980px);
      background: var(--surface);
      border: 1px solid var(--card-border);
      border-radius: 22px;
      padding: 24px;
      position: relative;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5);
    }

    .cert-modal__close {
      position: absolute;
      top: 16px;
      right: 18px;
      width: 40px;
      height: 40px;
      border: none;
      border-radius: 50%;
      background: rgba(255,255,255,0.05);
      color: var(--text);
      font-size: 1.8rem;
      cursor: pointer;
      line-height: 1;
    }

    .cert-modal__content h3 {
      margin: 0 0 20px;
      font-size: clamp(1.4rem, 2.4vw, 2rem);
      color: var(--green-light);
      padding-right: 46px;
    }

    .cert-modal__body {
      display: grid;
      grid-template-columns: 1fr 1.1fr;
      gap: 22px;
      align-items: start;
    }

    .cert-modal__image-box,
    .cert-modal__pdf-box {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      overflow: hidden;
      min-height: 320px;
    }

    .cert-modal__image-box img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      background: #111;
    }

    .cert-modal__pdf-box iframe {
      width: 100%;
      min-height: 420px;
      border: 0;
      background: #fff;
    }

    .cert-modal__actions {
      display: flex;
      justify-content: flex-end;
      gap: 12px;
      margin-top: 22px;
      flex-wrap: wrap;
    }

    .cert-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      text-decoration: none;
      border: none;
      border-radius: 12px;
      padding: 12px 18px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s ease, transform 0.2s ease;
    }

    .cert-btn:hover {
      transform: translateY(-1px);
      opacity: 0.96;
    }

    .cert-btn--primary {
      background: var(--green);
      color: #04120d;
    }

    .cert-btn--secondary {
      background: rgba(255,255,255,0.05);
      color: var(--text);
      border: 1px solid var(--card-border);
    }

    @media (max-width: 760px) {
      .cert-modal__body {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <header class="header">
    <h1>Biblioteca de Certificados</h1>
    <p>Bem-vindo à biblioteca de certificados! Aqui você pode acessar e visualizar todos os certificados dos cursos e treinamentos que eu concluí.</p>
  </header>

  <main>
    <section class="cert-grid" aria-label="Lista de certificados">

      <button
        class="cert-card"
        type="button"
        data-title="Curso de Aprendizagem industrial de qualidade"
        data-image="certificado-1.png"
        data-pdf="certificado_147520560.pdf"
      >
        <div class="cert-card__image">
          <img src="Certificado.png" alt="Prévia do certificado de Aprendizagem industrial de qualidade">
        </div>
        <div class="cert-card__content">
          <span class="cert-card__tag">Curso</span>
          <h2>Curso de Aprendizagem industrial de qualidade</h2>
          <p>Visualize o certificado e faça o download do PDF.</p>
        </div>
      </button>

      <button
        class="cert-card"
        type="button"
        data-title="JavaScript Avançado"
        data-image="certificado-2.png"
        data-pdf="certificado-2.pdf"
      >
        <div class="cert-card__image">
          <img src="certificado-2.png" alt="Prévia do certificado de JavaScript Avançado">
        </div>
        <div class="cert-card__content">
          <span class="cert-card__tag">Curso</span>
          <h2>JavaScript Avançado</h2>
          <p>Veja a imagem do certificado e baixe o arquivo oficial.</p>
        </div>
      </button>

    </section>
  </main>

  
  <div class="cert-modal" id="certModal" aria-hidden="true" role="dialog" aria-labelledby="modalTitle">
    <div class="cert-modal__content">
      <button class="cert-modal__close" id="closeModal" type="button" aria-label="Fechar modal">&times;</button>
      <h3 id="modalTitle">Certificado</h3>

      <div class="cert-modal__body">
        <div class="cert-modal__pdf-box" style="grid-column: 1 / -1;">
          <iframe id="modalPdf" title="Visualização do PDF"></iframe>
        </div>
      </div>

      <div class="cert-modal__actions">
        <button class="cert-btn cert-btn--secondary" id="closeModalBtn" type="button">Fechar</button>
        <a class="cert-btn cert-btn--primary" id="downloadPdf" href="#" download>Baixar PDF</a>
      </div>
    </div>
  </div>

  <script>
    const modal = document.getElementById('certModal');
    const modalTitle = document.getElementById('modalTitle');
    const modalPdf = document.getElementById('modalPdf');
    const downloadPdf = document.getElementById('downloadPdf');

    const closeModal = () => {
      modal.classList.remove('is-open');
      modal.setAttribute('aria-hidden', 'true');
      modalPdf.src = '';
    };

    document.querySelectorAll('.cert-card').forEach((card) => {
      card.addEventListener('click', () => {
        const title = card.dataset.title || 'Certificado';
        const pdf = card.dataset.pdf || '';

        modalTitle.textContent = title;

        if (pdf) {
          modalPdf.src = pdf;
          modalPdf.style.display = 'block';
          downloadPdf.href = pdf;
          downloadPdf.style.display = 'inline-flex';
          downloadPdf.setAttribute('download', pdf.split('/').pop());
        } else {
          modalPdf.src = '';
          modalPdf.style.display = 'none';
          downloadPdf.href = '#';
          downloadPdf.style.display = 'none';
        }

        modal.classList.add('is-open');
        modal.setAttribute('aria-hidden', 'false');
      });
    });

    document.getElementById('closeModal').addEventListener('click', closeModal);
    document.getElementById('closeModalBtn').addEventListener('click', closeModal);

    modal.addEventListener('click', (event) => {
      if (event.target === modal) {
        closeModal();
      }
    });

    document.addEventListener('keydown', (event) => {
      if (event.key === 'Escape' && modal.classList.contains('is-open')) {
        closeModal();
      }
    });
  </script>
</body>
</html>
